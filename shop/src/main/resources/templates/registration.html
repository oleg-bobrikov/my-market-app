<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        .login-container {
            max-width: 400px;
        }
        .alert-message {
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
<div class="container my-auto">
    <div class="card shadow-sm login-container mx-auto">
        <div class="card-body">

            <h2 class="card-title text-center mb-4">
                Регистрация
            </h2>
            <!-- ===================== -->
            <!-- УСПЕШНАЯ РЕГИСТРАЦИЯ -->
            <!-- ===================== -->
            <div th:if="${session.get('registration_success') != null}">
                <div class="alert-message alert-success"
                     role="alert">
                    <span th:text="${session.get('registration_success')}"></span>
                </div>
                <form th:action="@{/login}" method="get">
                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-primary">
                            Войти
                        </button>
                    </div>
                </form>
            </div>
            <!-- ===================== -->
            <!-- ФОРМА РЕГИСТРАЦИИ -->
            <!-- ===================== -->
            <div th:if="${session.get('registration_success') == null}">
                <!-- Ошибка регистрации -->
                <div th:if="${session.get('registration_error') != null}"
                     class="alert-message alert-error"
                     role="alert">
                    <span th:text="${session.get('registration_error')}">
                        Ошибка
                    </span>
                </div>
                <form th:action="@{/register}"
                      method="post">
                    <div class="mb-3">
                        <label for="reg_username"
                               class="form-label">
                            Имя пользователя
                        </label>

                        <input type="text"
                               id="reg_username"
                               name="username"
                               class="form-control"
                               placeholder="Придумайте имя пользователя"
                               required/>
                    </div>
                    <div class="mb-3">
                        <label for="reg_password"
                               class="form-label">
                            Пароль
                        </label>
                        <input type="password"
                               id="reg_password"
                               name="password"
                               class="form-control"
                               placeholder="Придумайте пароль"
                               required/>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit"
                                class="btn btn-success">
                            Зарегистрироваться
                        </button>
                    </div>
                </form>
                <!-- Уже есть аккаунт -->
                <div class="text-center">
                    Уже есть аккаунт?
                    <a th:href="@{/login}">
                        Войти
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
