<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            max-width: 400px;
        }
        .alert-message {
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div class="container my-auto">
    <div class="card shadow-sm login-container mx-auto">
        <div class="card-body">
            <h2 class="card-title text-center mb-4">Вход в систему</h2>
            <!-- Форма входа -->
            <div id="loginForm" th:style="'display:block;'">
                <!-- Сообщение об ошибке -->
                <div th:if="${session.get('login_error') != null}"
                     class="alert-message alert-error"
                     role="alert">
                    <span th:text="${session.get('login_error')}"></span>
                </div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               placeholder="Введите имя пользователя"
                               required
                               autofocus />
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               placeholder="Введите пароль"
                               required />
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
